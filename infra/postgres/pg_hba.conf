# Custom pg_hba.conf for app-db — no `trust` anywhere, including Unix
# socket and loopback (127.0.0.1/::1). The stock postgres:16-alpine image
# generates a default pg_hba.conf with `trust` for local/loopback
# connections, which means anything connecting via `-h localhost` (or a
# bare Unix socket, no -h at all) authenticates as any role with no
# password check whatsoever — confirmed live during Phase 4: several
# password-verification commands run against localhost gave false
# "success" confirmations that never actually checked the password. Every
# connection method here requires genuine scram-sha-256 authentication.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             all                     scram-sha-256
