networks:
  # Only the reverse proxy touches this network. Nothing else is internet-facing.
  public-net:
    driver: bridge

  # Reverse proxy bridges into here to reach app-tier services (keycloak, redis,
  # and — in a later phase — the NestJS API). Not reachable directly from public-net.
  app-net:
    driver: bridge
    internal: true

  # One dedicated, isolated network per datastore. This is deliberate: a single
  # shared "data-net" bridge would let app-db and keycloak-db reach each other by
  # default (Docker doesn't firewall containers on the same bridge from one
  # another). Splitting them is what makes "app-db and keycloak-db can never see
  # each other" a hard boundary instead of a convention. Each is `internal: true`
  # so nothing on it can reach the public internet either.
  data-net-appdb:
    driver: bridge
    internal: true
  data-net-keycloakdb:
    driver: bridge
    internal: true
  data-net-minio:
    driver: bridge
    internal: true

volumes:
  app-db-data:
  keycloak-db-data:
  redis-data:
  minio-data:
  vault-data:

services:
  # ---------------------------------------------------------------------------
  # Data tier — data-net-*, no host ports, reachable only from app-net-attached
  # services that are also joined to the relevant data-net-* network.
  # ---------------------------------------------------------------------------

  app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    networks:
      - data-net-appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - data-net-keycloakdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - data-net-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # App tier — app-net (internal), plus a data-net-* join where a service needs
  # its own datastore. No host ports; reachable only via reverse-proxy.
  # ---------------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # start-dev is a local-development convenience (no TLS/hostname hardening
    # required to boot). Swap to `start` with proper KC_HOSTNAME/TLS config
    # before this ever runs anywhere but a dev machine.
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app-net
      - data-net-keycloakdb
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      # command: bakes the password into the process's own --requirepass arg
      # at container creation; this is separate and makes it available as an
      # actual env var *inside* the container, which the healthcheck below
      # needs — without it, $REDIS_PASSWORD is unset in-container and every
      # healthcheck attempt silently authenticates with an empty password.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    # The image's entrypoint already passes -config=/vault/config (i.e. the
    # whole mounted directory) whenever the first arg is "server" — adding
    # our own -config flag on top of that loads config.hcl twice and makes
    # Vault try to bind the same listener port twice. Just "server" is correct.
    command: ["server"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./infra/vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/data
    networks:
      - app-net
    # No host port, ever (see infra/README.md) — the only access paths are
    # `docker exec` and, if a human needs the UI, a local port-forward over
    # `docker exec` or an SSH tunnel. Never routed through the reverse proxy.
    healthcheck:
      # Exits 0 only when initialized AND unsealed. Sealed (expected after
      # every restart, since there's no auto-unseal this phase) or
      # uninitialized both report unhealthy — that's intentional: a sealed
      # Vault genuinely isn't ready to serve secrets, and this makes any
      # future `depends_on: condition: service_healthy` wait for a human to
      # unseal it rather than racing ahead. For the full three-state detail
      # (uninitialized vs sealed vs unsealed), run `docker exec <container>
      # vault status` directly — Docker's healthcheck itself is binary.
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Edge — the only service on public-net. Bridges into app-net to reach
  # keycloak (and, later, the NestJS API).
  # ---------------------------------------------------------------------------

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    networks:
      - public-net
      - app-net
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this container's resolver returns ::1 for
      # "localhost" ahead of 127.0.0.1, and nginx.conf only listens on IPv4 —
      # so "localhost" hit a real connection-refused on every check. Verified
      # live: 127.0.0.1/healthz succeeds, localhost/healthz doesn't.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

